---
name: release-tiup-bench

on:
  release:
    types: [published]

permissions: {}

defaults:
  run:
    shell: bash

jobs:
  build:
    if: >-
      github.event_name == 'release' && github.event.action == 'published' &&
      !github.event.release.prerelease && !github.event.release.draft &&
      startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: true
      matrix:
        os: [linux, darwin]
        arch: [amd64, arm64]
    env:
      REL_VER: ${{ github.event.release.tag_name }}
      GOOS: ${{ matrix.os }}
      GOARCH: ${{ matrix.arch }}
    steps:
      - name: Validate release tag
        run: |
          [[ "$REL_VER" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          [[ "$GITHUB_REF" == "refs/tags/$REL_VER" ]]

      - name: Check out the event commit
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: '1.26.x'
          cache: false

      - name: Build and checksum package
        env:
          BUILD_FLAGS: -trimpath -mod=readonly -modcacherw -buildvcs=false
        run: |
          make package
          archive="tiup-bench-${REL_VER}-${GOOS}-${GOARCH}.tar.gz"
          mkdir dist
          mv "$archive" dist/
          (cd dist && sha256sum "$archive" > "$archive.sha256")

      - name: Upload this run's package
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: bench-${{ github.run_attempt }}-${{ matrix.os }}-${{ matrix.arch }}
          path: dist/*
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

  publish:
    needs: build
    if: >-
      github.event_name == 'release' && github.event.action == 'published' &&
      !github.event.release.prerelease && !github.event.release.draft &&
      startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    # Configure reviewers and tag restrictions BEFORE enabling this workflow.
    environment: tiup-production
    concurrency:
      group: tiup-production
      cancel-in-progress: false
    permissions:
      contents: write # Attach the verified packages to this GitHub release.
    env:
      REL_VER: ${{ github.event.release.tag_name }}
      RELEASE_CHANNEL: production
    steps:
      - name: Require explicit production configuration
        env:
          PRODUCTION_READY: ${{ vars.TIUP_PRODUCTION_READY }}
          PRODUCTION_MIRROR: ${{ vars.TIUP_PRODUCTION_MIRROR }}
        run: |
          [[ "$REL_VER" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          [[ "$GITHUB_REF" == "refs/tags/$REL_VER" ]]
          case "$RELEASE_CHANNEL" in
            production)
              [[ "$PRODUCTION_READY" == true ]] || {
                echo 'Configure the protected tiup-production Environment first.' >&2
                exit 1
              }
              [[ "$PRODUCTION_MIRROR" =~ ^https://[^/[:space:]@]+(/[^[:space:]]*)?$ ]] || {
                echo 'TIUP_PRODUCTION_MIRROR must be an explicit HTTPS mirror URL.' >&2
                exit 1
              }
              ;;
            *) echo 'Unsupported or empty release channel.' >&2; exit 1 ;;
          esac

      # No checkout, repository scripts, or build output executables in this job.
      - name: Download packages from this run and attempt
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: bench-${{ github.run_attempt }}-*
          path: packages
          merge-multiple: true

      - name: Verify all four packages before loading the key
        run: |
          python3 - <<'PY'
          import hashlib
          import os
          from pathlib import Path

          root = Path('packages')
          expected = set()
          for target_os in ('linux', 'darwin'):
              for arch in ('amd64', 'arm64'):
                  name = f"tiup-bench-{os.environ['REL_VER']}-{target_os}-{arch}.tar.gz"
                  archive = root / name
                  checksum = root / (name + '.sha256')
                  expected.update((archive.name, checksum.name))
                  if archive.is_symlink() or checksum.is_symlink():
                      raise SystemExit(f'Symlink artifact rejected: {name}')
                  digest = hashlib.sha256(archive.read_bytes()).hexdigest()
                  if checksum.read_text() != f'{digest}  {name}\n':
                      raise SystemExit(f'Checksum mismatch: {name}')
          if {entry.name for entry in root.iterdir()} != expected:
              raise SystemExit('Unexpected files in release artifacts')
          PY

      - name: Install the pinned and verified TiUP publisher
        env:
          TIUP_HOME: ${{ runner.temp }}/tiup-publisher
          PRODUCTION_MIRROR: ${{ vars.TIUP_PRODUCTION_MIRROR }}
        run: |
          umask 077
          mkdir -p "$TIUP_HOME/bin" "$TIUP_HOME/keys"
          archive="$RUNNER_TEMP/tiup-v1.17.1-linux-amd64.tar.gz"
          curl -fsSL --retry 3 --proto '=https' --proto-redir '=https' \
            https://github.com/pingcap/tiup/releases/download/v1.17.1/tiup-v1.17.1-linux-amd64.tar.gz \
            -o "$archive"
          printf '%s  %s\n' \
            0b09de9892a19798115f45356a379891e85a950fa86008f8e4b0cf7257766d32 \
            "$archive" | sha256sum -c -
          tar -xzOf "$archive" bin/tiup > "$TIUP_HOME/bin/tiup"
          tar -xzOf "$archive" bin/root.json > "$TIUP_HOME/trusted-root.json"
          cp "$TIUP_HOME/trusted-root.json" "$TIUP_HOME/bin/root.json"
          chmod 700 "$TIUP_HOME/bin/tiup"
          # mirror set overwrites bin/root.json, so its input must be a separate file.
          "$TIUP_HOME/bin/tiup" mirror set "$PRODUCTION_MIRROR" --root "$TIUP_HOME/trusted-root.json"

      - name: Sign and publish packages sequentially
        env:
          TIUP_HOME: ${{ runner.temp }}/tiup-publisher
          # This NEW name must exist only as an Environment secret, never at repo/org scope.
          TIUP_SIGNING_KEY: ${{ secrets.TIUP_PRODUCTION_SIGNING_KEY }}
        run: |
          set +x
          umask 077
          key="$TIUP_HOME/keys/private.json"
          trap 'rm -f -- "$key"' EXIT
          [[ -n "$TIUP_SIGNING_KEY" ]] || { echo 'Production signing key is missing.' >&2; exit 1; }
          printf '%s' "$TIUP_SIGNING_KEY" | base64 --decode > "$key"
          unset TIUP_SIGNING_KEY
          [[ -s "$key" ]]
          for target_os in linux darwin; do
            for arch in amd64 arm64; do
              "$TIUP_HOME/bin/tiup" mirror publish bench "$REL_VER" \
                "packages/tiup-bench-${REL_VER}-${target_os}-${arch}.tar.gz" tiup-bench \
                --os "$target_os" --arch "$arch" \
                --desc 'Benchmark database with different workloads'
            done
          done

      - name: Remove publisher and private key
        if: always()
        env:
          TIUP_HOME: ${{ runner.temp }}/tiup-publisher
        run: rm -rf -- "$TIUP_HOME"

      - name: Attach verified packages to the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "$REL_VER" packages/*.tar.gz packages/*.sha256 \
            --repo "$GITHUB_REPOSITORY" --clobber
